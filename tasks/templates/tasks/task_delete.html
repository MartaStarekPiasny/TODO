{% extends "tasks/base.html" %}

{% block content %}

<div class="card shadow-sm">
    <div class="card-header bg-danger text-white">
        Usuń zadanie
    </div>

    <div class="card-body">
        <h4>Czy na pewno chcesz usunąć zadanie?</h4>

        <p class="text-muted">
            {{ task.title }}
        </p>

        <form method="post">
            {% csrf_token %}

            <button class="btn btn-danger">
                Tak, usuń
            </button>

            <a href="{% url 'task_detail' task.id %}" class="btn btn-secondary">
                Anuluj
            </a>
        </form>
    </div>
</div>

{% endblock %}
