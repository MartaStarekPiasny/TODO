{% extends 'tasks/base.html' %}

{% block content %}

<h2 class="mb-4">
    {% if title %}
        {{ title }}
    {% else %}
        Dodaj kategorię
    {% endif %}
</h2>

<form method="post">
    {% csrf_token %}

    {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
    {% endif %}

    <div class="mb-3">
        {{ form.name.label_tag }}
        {{ form.name }}
    </div>

    <button class="btn btn-success">
        Zapisz kategorię
    </button>

    <a href="{% url 'categories' %}" class="btn btn-secondary">
        Anuluj
    </a>
</form>

{% endblock %}
