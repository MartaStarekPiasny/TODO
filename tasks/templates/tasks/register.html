{% extends 'tasks/base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="card card-custom p-4">

            <h3 class="text-center mb-4 title-accent">
                Rejestracja
            </h3>

            <form method="post">
                {% csrf_token %}

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Popraw błędy w formularzu
                    </div>
                {% endif %}

                <div class="mb-3">
                    <label>{{ form.username.label }}</label>
                    {{ form.username }}
                </div>

                <div class="mb-3">
                    <label>{{ form.email.label }}</label>
                    {{ form.email }}
                </div>

                <div class="mb-3">
                    <label>{{ form.password1.label }}</label>
                    {{ form.password1 }}
                </div>

                <div class="mb-3">
                    <label>{{ form.password2.label }}</label>
                    {{ form.password2 }}
                </div>

                <button class="btn btn-main w-100">
                    Zarejestruj się
                </button>
            </form>

            <div class="text-center mt-3">
                <small>
                    Masz już konto?
                    <a href="{% url 'login' %}" class="title-accent">Zaloguj się</a>
                </small>
            </div>

        </div>

    </div>
</div>

{% endblock %}
