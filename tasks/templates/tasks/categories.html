{% extends 'tasks/base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Kategorie</h2>

    <a href="{% url 'category_create' %}" class="btn btn-main">
        + Dodaj kategorię
    </a>
</div>

<div class="row">

    {% for category in categories %}
        <div class="col-md-4">
            <div class="card p-3 shadow-sm mb-3 border-0 card-task">

                <h5 class="mb-3 text-dark">
                    {{ category.name }}
                </h5>

                <div class="d-flex gap-2">
                    <a href="{% url 'index' %}?category={{ category.id }}" class="btn btn-sm btn-primary">
                        Zobacz zadania
                    </a>

                    <a href="{% url 'category_edit' category.id %}" class="btn btn-sm btn-warning text-dark">
                        Edytuj
                    </a>

                    <a href="{% url 'category_delete' category.id %}" class="btn btn-sm btn-danger">
                        Usuń
                    </a>
                </div>

            </div>
        </div>
    {% empty %}
        <p class="text-muted">Brak kategorii.</p>
    {% endfor %}

</div>

{% endblock %}
