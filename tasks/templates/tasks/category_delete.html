{% extends 'tasks/base.html' %}

{% block content %}

<div class="card shadow-sm border-0">
    <div class="card-header bg-danger text-white">
        Usuń kategorię
    </div>

    <div class="card-body">
        <h4>Czy na pewno chcesz usunąć kategorię?</h4>

        <p class="text-muted">
            {{ category.name }}
        </p>

        <p class="text-muted">
            Zadania przypisane do tej kategorii nie zostaną usunięte, ale stracą przypisaną kategorię.
        </p>

        <form method="post">
            {% csrf_token %}

            <button class="btn btn-danger">
                Tak, usuń
            </button>

            <a href="{% url 'categories' %}" class="btn btn-secondary">
                Anuluj
            </a>
        </form>
    </div>
</div>

{% endblock %}
